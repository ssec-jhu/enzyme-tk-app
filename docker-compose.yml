# docker-compose.yml — BASE configuration for EnzymeTK
#
# This file defines the common service topology shared by every
# environment (dev, prod, verify).  It is **not runnable on its own** —
# it has no port mappings, no host bind mounts, and no environment-
# specific tuning.  Compose with one of the overlays:
#
#   make dev             # → -f docker-compose.yml -f docker-compose.dev.yml
#   make prod            # → -f docker-compose.yml -f docker-compose.prod.yml
#   (verify agent)       # → adds -f docker-compose.verify.yml
#
# Three services:
#   web    — Dash app served by gunicorn
#   redis  — Celery broker + result backend
#   worker — Celery worker that executes tool compute tasks
#
# Volumes:
#   job-data — shared between web and worker for large job-result JSON
#              files written by the worker.  Mounted at /job-data.  The
#              external data tier (/data) is configured per-overlay.

services:
  # ── Dash web app ──────────────────────────────────────────────────
  web:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SHARED_VOLUME_PATH=/job-data
      - JOB_OUTPUTS_PATH=/job-data/job_outputs
      - ETK_DATA_DIR=/data
    volumes:
      - job-data:/job-data
    depends_on:
      - redis

  # ── Redis ─────────────────────────────────────────────────────────
  # Used as Celery broker AND result backend (same DB 0).
  redis:
    image: redis:7-alpine

  # ── Celery worker ────────────────────────────────────────────────
  # Runs tool compute tasks submitted by the web service.  Replica
  # count and other tuning live in the per-environment overlay.
  worker:
    build: .
    command: celery -A enzyme_tk_app.app.backend.celery_app worker -l info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SHARED_VOLUME_PATH=/job-data
      # Must match the web service so both containers resolve the same path.
      - JOB_OUTPUTS_PATH=/job-data/job_outputs
      - ETK_DATA_DIR=/data
    volumes:
      - job-data:/job-data
    depends_on:
      - redis

volumes:
  # Shared between web and worker for large job-result JSON files.
  job-data:
