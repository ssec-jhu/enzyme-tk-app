# docker-compose.yml — local / staging orchestration for EnzymeTK
#
# Four services:
#   web    — Dash app served by gunicorn (2 workers × 4 threads)
#   redis  — message broker + result store for Celery
#   worker — Celery worker that executes tool compute tasks
#   beat   — single Celery beat process; fires the periodic orphan sweep
#
# A named volume ("job-outputs") is shared between web and worker so large
# job results written by the worker can be read by the web container.
# Tool data (sequences, reactions, structures, foldseek DBs, etc.) is
# bind-mounted read-only from the host at /app-data.
#
# Usage:
#   docker compose up --build          # start everything
#   docker compose up --build -d       # start detached
#   docker compose down -v             # stop and remove volumes

services:
  # ── Dash web app ──────────────────────────────────────────────────
  web:
    build: .
    ports:
      - "8050:8050"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - JOB_OUTPUTS_PATH=${JOB_OUTPUTS_PATH:-/job-outputs}
      - ETK_DATA_DIR=/app-data
      # Admin dashboard secrets — supplied at deploy time via a local
      # .env file (gitignored), NEVER hardcoded here. Leaving them unset
      # disables the /admin login (fail-closed). See scripts/template.env.
      - ETK_ADMIN_TOKEN=${ETK_ADMIN_TOKEN:-}
      - ETK_SECRET_KEY=${ETK_SECRET_KEY:-}
      # Sliding idle window for an unlocked admin session, in seconds.
      # Every authenticated check slides it forward, including the
      # dashboard's 10 s poll, so an open tab never expires.
      - ETK_ADMIN_SESSION_TTL_SECONDS=${ETK_ADMIN_SESSION_TTL_SECONDS:-300}
      # Production switch — default OFF so a downloaded checkout runs locally
      # with no limits and no code edits. Set APP_IN_PRODUCTION_MODE=true in .env
      # for a public deployment; it sets the default for every individual
      # production flag below. web only: the worker serves no HTTP.
      - APP_IN_PRODUCTION_MODE=${APP_IN_PRODUCTION_MODE:-false}
      # Cookie Secure flag — NOT configurable and NOT auto-detected.
      # app.py sets Flask's SESSION_COOKIE_SECURE=True unconditionally, and
      # backend/session.py derives the anonymous etk_session_id cookie's flag
      # from the same key, so both cookies are always Secure. Browsers accept
      # them over http://localhost (a trustworthy origin); on any other
      # plain-HTTP origin they are dropped and session scoping collapses.
      # Deploy behind a TLS-terminating reverse proxy.
    volumes:
      - job-outputs:/job-outputs
      # TODO: change this path to where data is for deployment
      - ./enzyme_tk_app/app/data:/app-data:ro
    depends_on:
      - redis

  # ── Redis ─────────────────────────────────────────────────────────
  # Used as Celery broker AND result backend (same DB 0).
  redis:
    image: redis:7-alpine
    ports:
      # Map to host 6380 to avoid conflicts with a local Redis on 6379.
      - "6380:6379"

  # ── Celery worker ────────────────────────────────────────────────
  # Runs tool compute tasks submitted by the web service.
  # Each replica is an independent Celery worker process that pulls
  # tasks from the shared Redis broker.  Scale up/down with:
  #   docker compose up --scale worker=N
  worker:
    build: .
    command: celery -A enzyme_tk_app.app.backend.celery_app worker -l info
    deploy:
      replicas: 3
      # ── GPU (opt-in) ────────────────────────────────────────────
      # Func-E picks its device with torch.cuda.is_available(), so it
      # uses a GPU automatically once the container is given one — no
      # code change.  Two steps, both required:
      #   1. Rebuild against the CUDA wheels; the image defaults to CPU:
      #      docker compose build \
      #        --build-arg TORCH_INDEX_URL=https://download.pytorch.org/whl/cu124
      #   2. Uncomment the reservation below, on a linux/amd64 host with
      #      the NVIDIA driver + nvidia-container-toolkit installed.
      # (PyPI ships no CUDA torch for arm64, so this is a no-op there.)
      # resources:
      #   reservations:
      #     devices:
      #       - driver: nvidia
      #         count: 1
      #         capabilities: [gpu]
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Must match the web service so both containers resolve the same path.
      - JOB_OUTPUTS_PATH=${JOB_OUTPUTS_PATH:-/job-outputs}
      - ETK_DATA_DIR=/app-data
    volumes:
      - job-outputs:/job-outputs
      - ./enzyme_tk_app/app/data:/app-data:ro
    depends_on:
      - redis

  # ── Celery beat ──────────────────────────────────────────────────
  # Single scheduler process that fires the periodic orphan-output sweep.
  # MUST stay at one replica — a replicated beat fires duplicate ticks.
  # Beat only *schedules*: it enqueues the sweep task to Redis and a worker
  # executes it, so beat needs no job-outputs volume or path env — just the
  # broker URL and the sweep interval.
  beat:
    build: .
    command: celery -A enzyme_tk_app.app.backend.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      # How often the orphan-sweep fires (seconds)
      - CELERY_SWEEP_INTERVAL_SECONDS=${CELERY_SWEEP_INTERVAL_SECONDS:-86400}
    depends_on:
      - redis

volumes:
  # Shared between web and worker for large job-result JSON files.
  job-outputs:
