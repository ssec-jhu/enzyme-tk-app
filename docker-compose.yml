# docker-compose.yml — local / staging orchestration for EnzymeTK
#
# Three services:
#   web    — Dash app served by gunicorn (2 workers × 4 threads)
#   redis  — message broker + result store for Celery
#   worker — Celery worker that executes tool compute tasks
#
# A named volume ("job-data") is shared between web and worker so large
# job results written by the worker can be read by the web container.
# Tool data (sequences, reactions, structures, foldseek DBs, etc.) is
# bind-mounted read-only from the host at /app-data.
#
# Usage:
#   docker compose up --build          # start everything
#   docker compose up --build -d       # start detached
#   docker compose down -v             # stop and remove volumes

services:
  # ── Dash web app ──────────────────────────────────────────────────
  web:
    build: .
    ports:
      - "8050:8050"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SHARED_VOLUME_PATH=/job-data
      - JOB_OUTPUTS_PATH=/job-data/job_outputs
      - ETK_DATA_DIR=/app-data
      # SESSION_COOKIE_SECURE — the session cookie's Secure flag is
      # auto-detected from the request (request.is_secure) by default.
      # Set Flask's SESSION_COOKIE_SECURE=true in production behind a
      # TLS-terminating reverse proxy to force the flag on.
    volumes:
      - job-data:/job-data
      # TODO: change this path to where data is for deployment
      - ./enzyme_tk_app/app/data:/app-data:ro
    depends_on:
      - redis

  # ── Redis ─────────────────────────────────────────────────────────
  # Used as Celery broker AND result backend (same DB 0).
  redis:
    image: redis:7-alpine
    ports:
      # Map to host 6380 to avoid conflicts with a local Redis on 6379.
      - "6380:6379"

  # ── Celery worker ────────────────────────────────────────────────
  # Runs tool compute tasks submitted by the web service.
  # Each replica is an independent Celery worker process that pulls
  # tasks from the shared Redis broker.  Scale up/down with:
  #   docker compose up --scale worker=N
  worker:
    build: .
    command: celery -A enzyme_tk_app.app.backend.celery_app worker -l info
    deploy:
      replicas: 3
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SHARED_VOLUME_PATH=/job-data
      # Must match the web service so both containers resolve the same path.
      - JOB_OUTPUTS_PATH=/job-data/job_outputs
      - ETK_DATA_DIR=/app-data
    volumes:
      - job-data:/job-data
      - ./enzyme_tk_app/app/data:/app-data:ro
    depends_on:
      - redis

volumes:
  # Shared between web and worker for large job-result JSON files.
  job-data:
