version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # sphinx-rtd-theme 3.x requires sphinx <9, so we cannot upgrade
      # Sphinx past 8.x until sphinx-rtd-theme adds Sphinx 9 support.
      - dependency-name: "sphinx"
        versions: [">=9"]
    groups:
      all-minor-and-patch-dependency-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
