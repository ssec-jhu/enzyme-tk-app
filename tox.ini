# This can be run and tested using ``tox run``.

[tox]
envlist =
    check-{style,security}
    format
    test
    test-docker-dependent
    build-{docs,dist}

[testenv:check-style]
description = check code style
skip_install = true
deps =
    -r requirements/test.txt
commands =
    ruff format . --check {posargs}
    ruff check . --select E --select F --select I {posargs}
    # NB: New projects should consider replacing the above with below!
    # ruff check . {posargs}

[testenv:check-security]
description = run bandit to check security compliance
skip_install = true
deps =
    -r requirements/test.txt
commands =
    bandit -c pyproject.toml --severity-level=medium -r enzyme_tk_app

[testenv:format]
description = format code and sort imports using ruff
skip_install = true
deps =
    -r requirements/test.txt
commands =
    ruff format . {posargs}
    ruff check --select I --select F401 --fix . {posargs}

[testenv]
description = run tests
passenv = *
extras = dev
deps =
    -r requirements/test.txt
    -r requirements/prd.txt
commands=
    pytest --cov=./ --cov-report=html:coverage.html --cov-report=xml:coverage.xml {posargs}

[testenv:build-docs]
description = invoke sphinx-build to build the HTML docs
extras = docs
allowlist_externals=make
change_dir = docs
setenv =
    SPHINXOPTS=-W
deps =
    -r requirements/docs.txt
commands = make clean html latex epub

# Docker-dependent integration tests
# -----------------------------------
# Some tools require binaries (diamond, foldseek) that are only
# installed inside the Docker image (see Dockerfile).  These tests are
# executed via ``docker compose run`` against the worker container in a
# single invocation to avoid duplicate container startup + pip install.
#
# ``ignore_outcome = true`` ensures a bare ``tox`` still succeeds on
# machines without Docker (e.g. local dev without containers running).
# The env will be marked as failed in the tox summary but will not
# block the overall run.
#
# Run standalone:  tox -e test-docker-dependent
# Requires:        Docker Desktop running (no need for ``docker compose up``)
[testenv:test-docker-dependent]
description = run docker-dependent tests inside Docker (requires Docker)
skip_install = true
allowlist_externals = docker
ignore_outcome = true
commands =
    docker compose run --rm --no-deps worker \
        sh -c "pip install --root-user-action=ignore --quiet -r requirements/test.txt && python -m pytest enzyme_tk_app/app/tests/test_tools_sequence_similarity.py enzyme_tk_app/app/tests/test_tools_sequence_structure_similarity.py -v {posargs}"

[testenv:build-dist]
description = build
skip_install = true
deps =
    -r requirements/build.txt
commands =
    python -m build
